run:
  deadline: 600s
  tests: true
  skip-dirs:
    - testdata

linters:
  disable-all: true
  enable:
    - govet
    - revive
    - unused
    - errcheck
    - staticcheck
    - ineffassign
    - unconvert
    - goimports
    - misspell
    - lll
    - nakedret
    - gocritic

linters-settings:
  lll:
    line-length: 120

issues:
  exclude-use-default: false